name: Warehouse quality gate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: make install
      - run: .venv/bin/ruff check src tests
      - run: make smoke
      - run: make regression
      - run: make defects
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warehouse-quality-evidence
          path: artifacts/
  # Cloud execution intentionally stays manual until an account and budget exist.
