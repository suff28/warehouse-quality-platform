- id: QE-039
  requirement: REQ-04
  name: Fact source count
  severity: critical
  sql: select (select count(*) from raw.order_items) expected, (select count(*) from
    analytics.fct_order_items) actual where expected != actual
- id: QE-040
  requirement: REQ-04
  name: Order source count
  severity: critical
  sql: select (select count(distinct order_id) from raw.orders) expected, (select
    count(*) from analytics.fct_orders) actual where expected != actual
- id: QE-041
  requirement: REQ-04
  name: Independent line amounts
  severity: critical
  sql: select r.order_id,r.line_id from raw.order_items r full outer join analytics.fct_order_items
    f on r.order_id=f.order_id and r.line_id=f.line_id where r.order_id is null or
    f.order_id is null or f.net_amount != cast(r.quantity*r.unit_price-r.discount_amount
    as decimal(18,2))
- id: QE-042
  requirement: REQ-04
  name: Daily net sales reconciliation
  severity: critical
  sql: with e as (select cast(o.purchased_at as date) date_key,sum(i.quantity*i.unit_price-i.discount_amount)
    amount from raw.order_items i join analytics.stg_orders o on i.order_id=o.order_id
    where o.status!='cancelled' group by 1) select coalesce(e.date_key,a.date_key)
    date_key,e.amount,a.net_sales from e full outer join analytics.mart_daily_sales
    a on e.date_key=a.date_key where e.date_key is null or a.date_key is null or e.amount!=a.net_sales
- id: QE-043
  requirement: REQ-05
  name: Customer historical key required
  severity: critical
  sql: select order_item_key from analytics.fct_order_items where customer_key is
    null
- id: QE-044
  requirement: REQ-05
  name: Customer one current version
  severity: critical
  sql: select customer_id from analytics.dim_customer group by customer_id having
    sum(case when valid_to is null then 1 else 0 end)!=1
- id: QE-045
  requirement: REQ-05
  name: Customer valid intervals
  severity: critical
  sql: select customer_key from analytics.dim_customer where valid_to<=valid_from
- id: QE-046
  requirement: REQ-05
  name: Customer no overlapping intervals
  severity: critical
  sql: select customer_id from (select *,lead(valid_from) over(partition by customer_id
    order by valid_from) nxt from analytics.dim_customer) t where nxt is not null
    and (valid_to is null or valid_to>nxt)
- id: QE-047
  requirement: REQ-05
  name: Temporal customer attribution
  severity: critical
  sql: select f.order_item_key from analytics.fct_order_items f join analytics.stg_orders
    o on f.order_id=o.order_id join analytics.dim_customer c on f.customer_key=c.customer_key
    where o.purchased_at<c.valid_from or (c.valid_to is not null and o.purchased_at>=c.valid_to)
