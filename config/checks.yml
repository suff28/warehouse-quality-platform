- id: QE-059
  requirement: REQ-06
  name: Payment order totals
  severity: critical
  sql: select p.order_id from analytics.fct_payments p join (select order_id,sum(net_amount+freight_amount)
    amount from analytics.fct_order_items group by order_id) f on p.order_id=f.order_id
    where abs(p.paid_amount-f.amount)>0.01
